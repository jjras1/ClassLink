<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open a page</title>

  <!-- Font files are served by jsDelivr from the npm package @fontsource/ibm-plex-sans -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.8/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.8/600.css">

  <style>
    :root {
      --paper: #eef2f4;
      --ink: #14232b;
      --muted: #55676f;
      --line: #b9c6cc;
      --accent: #0b5d7a;
      --error: #9b2c2c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.5;
    }
    main { width: min(40rem, 100%); }
    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    form { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.9rem 1rem;
      font: inherit;
      font-size: 1.1rem;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 6px;
    }
    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    button {
      padding: 0.9rem 1.4rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #084a63; }
    p { margin: 0.9rem 0 0; color: var(--muted); font-size: 0.95rem; }
    #error { color: var(--error); min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1>Open a page</h1>
    <form id="go">
      <input id="address" type="text" inputmode="url" autocomplete="off" autofocus
             placeholder="Enter a web address, like example.com" aria-label="Web address">
      <button type="submit">Open page</button>
    </form>
    <p id="error" role="alert"></p>
    <p>Pages load through this server. Sites that depend heavily on JavaScript may not work fully.</p>
  </main>

  <script>
    document.getElementById('go').addEventListener('submit', function (e) {
      e.preventDefault();
      var raw = document.getElementById('address').value.trim();
      var error = document.getElementById('error');
      error.textContent = '';
      if (!raw) { error.textContent = 'Enter a web address first.'; return; }
      if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
      try {
        var url = new URL(raw);
        if (!url.hostname.includes('.')) throw new Error('bad host');
        location.href = '/proxy?url=' + encodeURIComponent(url.href);
      } catch (err) {
        error.textContent = 'That doesn\u2019t look like a web address. Try something like example.com.';
      }
    });
  </script>
</body>
</html>
