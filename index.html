<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PP12 Home</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: system-ui, sans-serif;
      font-size: 1.5rem;
      background: #fff;
      color: #111;
    }
    p { margin: 0; }
  </style>
</head>
<body>
  <p> -PP12 Home- </p>
  <p> </p>
  <p>114223 wait for load</p>
  <p>225334 wait like 10s</p>
  <p>336445 wait for nothing, js log in</p>

  <script>
    const ROUTES = {
      "114223": "https://reyart.s3.us-east-2.amazonaws.com/114223.html",
      "225334": "https://reyart.s3.us-east-2.amazonaws.com/removed.html",
      "336445": "https://reyart.s3.us-east-2.amazonaws.com/chat.html"
    };
    const MAX_LEN = Math.max(...Object.keys(ROUTES).map(c => c.length));
    let typed = "";

    document.addEventListener("keydown", (e) => {
      if (e.key.length !== 1) return;              // ignore Shift, Enter, etc.
      typed = (typed + e.key).slice(-MAX_LEN);     // keep only the most recent keys
      for (const code in ROUTES) {
        if (typed.endsWith(code)) {
          window.location.href = ROUTES[code];
          return;
        }
      }
    });
  </script>
</body>
</html>
